<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiftIQ Performance</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --pos: #2a78d6; --neg: #e34948; --mid: #f0efec;
  --good-text: #006300; --bad-text: #c02f2f;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --info: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --pos: #3987e5; --neg: #e66767; --mid: #383835;
    --good-text: #0ca30c; --bad-text: #ef7a7a; --info: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --pos: #3987e5; --neg: #e66767; --mid: #383835;
  --good-text: #0ca30c; --bad-text: #ef7a7a; --info: #3987e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--page);
  border-bottom: 1px solid var(--border);
}
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-top: 12px; padding-bottom: 12px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; }
h1 small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-left: auto; }
.controls label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; cursor: pointer; }
select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; }
button { cursor: pointer; }
button:hover, select:hover { background: var(--wash); }
input[type=checkbox] { accent-color: var(--s1); width: 16px; height: 16px; margin: 0; }
section { margin-top: 28px; }
h2 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
.sub { color: var(--ink-2); margin: 0 0 12px; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile .label { color: var(--ink-2); font-size: 13px; }
.tile .value { font-size: 24px; font-weight: 650; margin: 2px 0; letter-spacing: -0.01em; }
.tile .delta { font-size: 12.5px; color: var(--ink-2); min-height: 18px; }
.tile .delta b { font-weight: 600; }
.up-good { color: var(--good-text); } .down-bad { color: var(--bad-text); }
.tile svg { display: block; width: 100%; height: 34px; margin-top: 8px; overflow: visible; }
.charts2 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
.chart { width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text, .tile text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart text.lab { fill: var(--ink-2); font-size: 12px; }
.chart text.val { fill: var(--ink); font-size: 11.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 9px; padding: 2px; gap: 2px; background: var(--surface); margin-bottom: 12px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; color: var(--ink-2); }
.seg button[aria-pressed=true] { background: var(--ink); color: var(--page); }
.summary { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.summary b { color: var(--ink); font-weight: 600; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
td:first-child { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th[data-sort]::after { content: " \2195"; color: var(--muted); }
th.asc::after { content: " \2191"; color: var(--ink); }
th.desc::after { content: " \2193"; color: var(--ink); }
th.status, td.status { text-align: left; white-space: normal; min-width: 150px; }
tbody tr:hover { background: var(--wash); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 7px 1px 5px; border-radius: 999px; border: 1px solid var(--border); margin: 1px 3px 1px 0; color: var(--ink); white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.heat { display: grid; gap: 2px; min-width: 640px; }
.heat .h { font-size: 12px; color: var(--ink-2); padding: 4px 6px; display: flex; align-items: flex-end; }
.heat .h.col { justify-content: center; text-align: center; line-height: 1.2; }
.heat .h:not(.col) { position: sticky; left: 0; background: var(--surface); z-index: 1; }
.heat .c { height: 40px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-variant-numeric: tabular-nums; cursor: default; }
.heat .c.empty { color: var(--muted); border: 1px dashed var(--grid); background: transparent; }
.heat .c.newcell { outline: 1px dashed var(--axis); outline-offset: -3px; }
.heat-legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.heat-legend .bar { width: 180px; height: 10px; border-radius: 3px; }
.notes { columns: 2 320px; column-gap: 32px; }
.notes h3 { font-size: 13.5px; margin: 0 0 4px; break-after: avoid; }
.notes div { break-inside: avoid; margin-bottom: 14px; color: var(--ink-2); }
.notes code { font-size: 12px; background: var(--wash); padding: 1px 4px; border-radius: 4px; color: var(--ink); }
.notes ul { margin: 4px 0 0; padding-left: 18px; }
.card h2 { margin-bottom: 2px; }
.card .legend { margin-top: 8px; }
details.more { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 10px; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
details.method summary { font-weight: 600; color: var(--ink); font-size: 14px; }
details.method[open] summary { margin-bottom: 12px; }
.flagtoggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-bottom: 14px; cursor: pointer; }
.chart text.chiplab { font-size: 11px; fill: var(--ink-2); }
.ceo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ceo .card { display: flex; flex-direction: column; gap: 6px; }
.ceo .n { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.02em; }
.ceo h3 { font-size: 15.5px; margin: 0; line-height: 1.3; }
.ceo .big { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.1; }
.ceo .big small { font-size: 13px; font-weight: 400; color: var(--ink-2); margin-left: 4px; }
.ceo p { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.ceo p b { color: var(--ink); font-weight: 600; }
.ceo .act { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--grid); color: var(--ink); }
.ceo .mini svg { display: block; width: 100%; overflow: visible; }
.ceo .mini text { font: 10.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }
.ceo .keys { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--ink-2); }
.ceo .keys i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
@media (max-width: 1000px) { .ceo { grid-template-columns: 1fr; } }
.empty-msg { color: var(--muted); padding: 24px 0; text-align: center; }
#tip {
  position: fixed; z-index: 50; pointer-events: none; display: none; max-width: 300px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.18); padding: 8px 10px; font-size: 12.5px;
}
#tip .t { font-weight: 600; margin-bottom: 4px; }
#tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
#tip .r span:first-child { color: var(--ink-2); }
#tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
@media (max-width: 1000px) { .charts2 { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tile .value { font-size: 20px; }
  .card { padding: 12px; }
  .controls { margin-left: 0; }
  h1 small { display: block; margin: 0; }
  header.top { position: static; }
}
</style>
</head>

<header class="top">
  <div class="wrap">
    <h1>LiftIQ performance <small id="srcnote"></small></h1>
    <div class="controls">
      <label>Month <select id="month"></select></label>

<main class="wrap">

  <section>

  </section>

  <section>
    <div class="card">

      <details class="more">
        <summary>Full table: revenue, margin and status</summary>
        <div class="scroll"><table id="movers-table"></table></div>
      </details>
    </div>
  </section>

  <section>
    <div class="card">
      <h2 id="heat-title"></h2>
      <p class="sub" id="heat-sub"></p>
      <div class="scroll"><div class="heat" id="heat"></div></div>
      <div class="heat-legend" id="heat-legend"></div>
    </div>
  </section>

  <section>
    <details class="card method">
      <summary>Methodology</summary>
      <label class="flagtoggle"><input type="checkbox" id="flagged"> Include flagged rows (Green Roof Solar, 27 Apr)</label>
      <div class="notes" id="notes"></div>
    </details>
  </section>
</main>

// Margin is always sum(profit) / sum(revenue). Never an average of row margins.
function total(rows) {
  const t = { clicks: 0, conv: 0, rev: 0, pay: 0 };
  for (const r of rows) { t.clicks += r.clicks; t.conv += r.conv; t.rev += r.rev; t.pay += r.pay; }
  t.profit = t.rev - t.pay;
  t.margin = t.rev ? t.profit / t.rev : null;
  return t;
}
// Divide additive metrics by days in month when "Per day" is on. Margin is a ratio and is unchanged.
function scaled(t, m) {
  if (!state.perDay) return t;
  const d = DAYS[m];
  return { clicks: t.clicks / d, conv: t.conv / d, rev: t.rev / d, pay: t.pay / d, profit: t.profit / d, margin: t.margin };
}
const pctChange = (cur, prev) => (prev ? (cur - prev) / Math.abs(prev) : null);

  const out = {}; for (const m of MONTHS) out[m] = scaled(total(g[m]), m);

/* ---------- formatting ---------- */
const MINUS = '−';

  const a = Math.abs(v), s = v < 0 ? MINUS : '';
  if (!compact) return s + '$' + Math.round(a).toLocaleString('en-US');
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(2) + 'M';
  if (a >= 1e4) return s + '$' + (a / 1e3).toFixed(1) + 'K';
  if (a >= 1e3) return s + '$' + (a / 1e3).toFixed(2) + 'K';
  return s + '$' + a.toFixed(0);
}
function num(v) {

  if (a >= 1e4) return s + (a / 1e3).toFixed(1) + 'K';

}
const pct = (v, d = 1) => (v == null ? 'n/a' : (v * 100).toFixed(d) + '%');

function showTip(html, x, y) {

  let left = x + 14, top = y + 14;

  if (top + h > vh - 8) top = Math.max(8, y - h - 14);

}

/* ---------- svg helpers ---------- */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs = {}, parent) {

}
function niceTicks(min, max, n = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}

function hbarPath(x0, x1, y, h, r = 4) {

  r = Math.min(r, len, h / 2);

  return `M${x0},${y}H${xe}Q${x1},${y} ${x1},${y + r}V${y + h - r}Q${x1},${y + h} ${xe},${y + h}H${x0}Z`;

/* ---------- line chart ---------- */
function lineChart(host, { series, fmtAxis, fmtVal, height = 250, zero = true, endLabels = true, onPick }) {
  host.innerHTML = '';
  const W = Math.max(host.clientWidth, 200), H = height;
  const m = { l: 52, r: endLabels ? 70 : 52, t: 14, b: 26 };
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img' }, host);

  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const n = MONTHS.length, pw = W - m.l - m.r, ph = H - m.t - m.b;

  for (const t of ticks) {
    svgEl('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? css('--axis') : css('--grid'), 'stroke-width': 1 }, svg);

  }
  MONTHS.forEach((mo, i) => {
    const t = svgEl('text', { x: x(i), y: H - 6, 'text-anchor': 'middle' }, svg);
    t.textContent = monthName(mo);
    if (i === si) t.setAttribute('style', 'fill:var(--ink);font-weight:600');
  });
  for (const s of series) {
    const pts = s.values.map((v, i) => (v == null ? null : [x(i), y(v)])).filter(Boolean);
    svgEl('polyline', { points: pts.map(p => p.join(',')).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
    const last = s.values.length - 1;
    svgEl('circle', { cx: x(si), cy: y(s.values[si]), r: 4, fill: s.color, stroke: css('--surface'), 'stroke-width': 2 }, svg);
    if (endLabels) {
      const t = svgEl('text', { x: x(last) + 8, y: y(s.values[last]) + 4, class: 'lab' }, svg);
      t.textContent = s.name;
    } else {

  const dots = series.map(s => svgEl('circle', { r: 4, fill: s.color, stroke: css('--surface'), 'stroke-width': 2, visibility: 'hidden' }, svg));

  const idxAt = e => {
    const r = svg.getBoundingClientRect(), px = ((e.clientX - r.left) / r.width) * W;

/* ---------- what moved profit ---------- */
function groupMonthly(rows, key) {
  // returns Map(name -> {month -> totals})
  const g = new Map();
  for (const r of rows) {
    if (!g.has(r[key])) g.set(r[key], {});
    const o = g.get(r[key]); (o[r.m] = o[r.m] || []).push(r);
  }
  const out = new Map();
  for (const [name, o] of g) {
    const t = {}; for (const m of MONTHS) t[m] = scaled(total(o[m] || []), m);
    out.set(name, t);
  }
  return out;
}
// Baseline for "Margin eroding" = January, or the entity's first active month if it started later.
function baselineMonth(t) { return MONTHS.find(m => t[m].rev > 0) || null; }

function moverStats(key) {
  const cur = state.month, pm = prevMonth(cur);
  const g = groupMonthly(visibleRows(), key), items = [];
  for (const [name, t] of g) {
    const c = t[cur], p = pm ? t[pm] : null;
    if (!(c.rev > 0 || (p && p.rev > 0))) continue;
    const bm = baselineMonth(t);
    const it = {
      name, rev: c.rev, revPrev: p ? p.rev : null, profit: c.profit, profitPrev: p ? p.profit : null,
      margin: c.margin, marginPrev: p ? p.margin : null, conv: c.conv,
      revMoM: p ? pctChange(c.rev, p.rev) : null,
      dProfit: p ? c.profit - p.profit : null,
      dMarginMoM: p && c.margin != null && p.margin != null ? c.margin - p.margin : null,
      baseMonth: bm, dMarginBase: bm && bm !== cur && c.margin != null ? c.margin - t[bm].margin : null
    };
    const chips = [];
    if (p && p.rev === 0 && c.rev > 0) chips.push('new');
    if (p && p.rev > 0 && c.rev === 0) chips.push('stopped');
    if (p && p.rev > 0 && c.rev > 0 && it.revMoM <= -0.15) chips.push('drop');
    if (p && p.rev > 0 && c.rev > 0 && it.revMoM >= 0.08) chips.push('growing');
    if (it.dMarginBase != null && it.dMarginBase <= -0.08) chips.push('eroding');
    it.chips = chips;
    items.push(it);
  }
  return items;
}

/* ---------- heatmap ---------- */
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const lum = h => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };

function heatColor(d) {
  if (d == null) return css('--mid');
  const t = Math.max(-1, Math.min(1, d / HEAT_CLAMP));
  return mix(css('--mid'), t < 0 ? css('--neg') : css('--pos'), Math.abs(t));
}
function renderHeat() {
  const host = document.getElementById('heat'), cur = state.month;
  const rows = visibleRows();
  const advs = [...new Set(rows.map(r => r.adv))].sort(), pubs = [...new Set(rows.map(r => r.pub))].sort();
  const cell = {};
  for (const r of rows) { const k = r.adv + '|' + r.pub; ((cell[k] = cell[k] || {})[r.m] = cell[k][r.m] || []).push(r); }
  document.getElementById('heat-sub').textContent =
    `Number = margin in ${monthName(cur, true)}. Colour = change vs ${monthName(MONTHS[0], true).split(' ')[0]}. Dashed = started later, compared with its first month.`;
  const advT = groupMonthly(rows, 'adv'); let worst = null;
  for (const [name, t] of advT) {
    const bm = baselineMonth(t); if (!bm || bm === cur || !(t[cur].rev > 0)) continue;
    const d = t[cur].margin - t[bm].margin; if (!worst || d < worst.d) worst = { name, d, bm, m: t[cur].margin, base: t[bm].margin };
  }
  host.style.gridTemplateColumns = `minmax(150px, 1.4fr) repeat(${pubs.length}, minmax(64px, 1fr))`;
  let html = '<div class="h"></div>' + pubs.map(p => `<div class="h col">${esc(p)}</div>`).join('');
  const meta = [];
  for (const a of advs) {
    html += `<div class="h">${esc(a)}</div>`;
    for (const p of pubs) {
      const o = cell[a + '|' + p] || {};
      const t = {}; for (const m of MONTHS) t[m] = total(o[m] || []);
      const c = t[cur];
      if (!(c.rev > 0)) { html += `<div class="c empty">–</div>`; meta.push(null); continue; }
      const bm = baselineMonth(t), d = bm !== cur ? c.margin - t[bm].margin : null;
      const bg = heatColor(d), fg = lum(bg) > 0.45 ? '#0b0b0b' : '#ffffff';
      html += `<div class="c ${bm !== MONTHS[0] ? 'newcell' : ''}" data-i="${meta.length}" style="background:${bg};color:${fg}">${(c.margin * 100).toFixed(0)}%</div>`;
      meta.push({ a, p, c, bm, base: t[bm], d });
    }
  }
  host.innerHTML = html;
  const title = document.getElementById('heat-title');
  if (worst && worst.d <= -0.02) {

    title.textContent = `Biggest margin loss: ${worst.name}, ${pct(worst.base)} to ${pct(worst.m)} since ${monthName(worst.bm)}` +
      (cells.length > 1 ? `, down at ${hit === cells.length ? 'all ' + hit : hit + ' of ' + cells.length} of its publishers` : '');
  } else title.textContent = `No advertiser has lost more than 2 pp of margin since ${monthName(MONTHS[0])}`;
  host.querySelectorAll('.c[data-i]').forEach(el => {
    const mt = meta[+el.dataset.i];
    hoverable(el, () => `<div class="t">${esc(mt.a)} × ${esc(mt.p)}</div>` +
      tipRow(`Margin ${monthName(cur)}`, pct(mt.c.margin)) +
      tipRow(`Margin ${monthName(mt.bm)} (baseline)`, pct(mt.base.margin)) +
      tipRow('Change', mt.d == null ? 'first active month' : pp(mt.d, 1)) +

  document.getElementById('heat-legend').innerHTML =
    `<span>${MINUS}10 pp or worse</span><span class="bar" style="background:linear-gradient(90deg,${stops.join(',')})"></span><span>+10 pp or better</span>` +
    '';
}

// Small diverging column chart: one stacked column per month, gains above zero, losses below.
function miniImpact(host, parts) {
  host.innerHTML = '';
  const W = Math.max(host.clientWidth, 200), H = 92, m = { t: 6, b: 16 }, n = MONTHS.length;
  const pos = MONTHS.map((_, i) => parts.reduce((a, p) => a + Math.max(0, p.values[i]), 0));
  const neg = MONTHS.map((_, i) => parts.reduce((a, p) => a + Math.min(0, p.values[i]), 0));
  const hi = Math.max(...pos, 0), lo = Math.min(...neg, 0), span = (hi - lo) || 1;
  const y = v => m.t + ((hi - v) / span) * (H - m.t - m.b);
  const band = W / n, bw = Math.min(24, band * 0.55);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, height: H, role: 'img' }, host);
  MONTHS.forEach((mo, i) => {
    const cx = band * i + band / 2, g = svgEl('g', {}, svg);
    svgEl('rect', { x: band * i, y: 0, width: band, height: H, fill: 'transparent' }, g);
    let up = 0, down = 0;
    parts.forEach(p => {
      const v = p.values[i]; if (Math.abs(v) < 1) return;
      const a = v > 0 ? up : down, b = a + v;
      const y0 = y(a), y1 = y(b), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0) - 2);

    hoverable(g, () => `<div class="t">${monthName(mo, true)}</div>` +

      (parts.length > 1 ? tipRow('Net', sign(up + down, money(Math.abs(up + down), false))) : ''));
  });
  svgEl('line', { x1: 0, x2: W, y1: y(0), y2: y(0), stroke: css('--axis'), 'stroke-width': 1 }, svg);
}

  const be = new Date(S.months[last] + '-15'); be.setMonth(be.getMonth() + Math.ceil(c.months_to_breakeven));
  const breakEven = be.toLocaleString('en-US', { month: 'long' });
  const cards = [
    {
      title: 'Cobalt Mortgage margin is being given away to publishers',
      big: `${MINUS}${k(c.loss[last])}<small>profit lost in ${mo}, bigger every month</small>`,
      cause: `Cobalt still pays us <b>${money(c.rpc_last, false)}</b> per lead, but we now pay publishers <b>${money(c.ppc_last, false)}</b>, up from ${money(c.ppc_first, false)} in January. The payout rose about ${money(c.step, false)} on the 1st of every month, on all 4 publishers at once. Margin fell from ${pct(c.margin_first)} to ${pct(c.margin_last)}. <b>At this pace payout passes revenue around ${breakEven}</b>, and every Cobalt lead loses money.`,
      act: `<b>Action:</b> freeze Cobalt payouts now, find who approved the monthly increases, and roll back toward the January rate.`,
      parts: [{ name: 'Cobalt profit lost vs January payout rate', values: c.loss, color: '--neg' }]
    },
    {
      title: 'Flat revenue hides lost clients. One new advertiser is covering for them',
      big: `${MINUS}${k(lostVolume)}<small>a month from Everpeak and Summit, offset by Lumen +${k(g.lumen[last])}</small>`,
      cause: `<b>Everpeak</b> was capped overnight on 1 April (${g.everpeak_clicks_before} to ${g.everpeak_clicks_after} clicks a day), then its price per lead fell from ${money(g.everpeak_rpc_q1, false)} to ${money(g.everpeak_rpc_last, false)}. <b>Summit</b> cut volume in two steps, on 1 May and 1 June, with price and margin unchanged. That is likely a post-tax-season budget, not a lost client, but we have no 2024 data to prove it. <b>Lumen</b> (new in March, same AE and vertical as Everpeak) carries all the growth.`,
      act: `<b>Action:</b> AEs get the reason and a restart date from Everpeak and Summit this week. Check whether Everpeak's solar budget moved to Lumen.`,
      parts: [
        { name: 'Lumen Energy (new)', values: g.lumen, color: '--pos' },
        { name: 'Everpeak vs Q1 run rate', values: g.everpeak, color: '--neg' },
        { name: 'Summit vs Jan to Apr run rate', values: g.summit, color: '--serious' }
      ]
    },
    {
      title: 'Cascade Traffic is quietly raising its price. Vertex is our biggest margin opportunity',
      big: `${MINUS}${k(p.cascade[last])}<small>Cascade leak in ${mo}, bigger every month</small>`,
      cause: `<b>Cascade</b>'s payout share rises every month on every offer it runs, while the advertisers pay the same: its margin went from ${pct(p.cascade_margin[0])} to ${pct(p.cascade_margin[last])}. That is why BlueHarbor and Everpeak show red only with Cascade. Separately, <b>Vertex Clicks</b> earns us ${pct(p.vertex_margin)} on BlueHarbor, Northwind and Summit, where other publishers earn ${pct(p.others_margin)} on the same offers. That is not a loss, it has been flat all year, but it is <b>up to ${k(p.vertex[last])} a month</b> of upside if we could get the same volume at network rates. We do not know yet that we can.`,
      act: `<b>Action:</b> reset Cascade to January rates now. Then test Vertex: renegotiate its rate, or move a slice of its volume to Apex and Meridian and see if it holds.`,
      parts: [{ name: 'Cascade vs its January margin (excl. Cobalt)', values: p.cascade, color: '--neg' }]
    }
  ];
  const host = document.getElementById('ceo');
  host.innerHTML = cards.map((c, i) => `<div class="card"><div class="n">${i + 1}</div><h3>${c.title}</h3><div class="big">${c.big}</div>
    <div class="mini" id="mini${i}"></div><div class="keys">${c.parts.map(p => `<span><i style="background:var(${p.color})"></i>${esc(p.name)}</span>`).join('')}</div>
    <p>${c.cause}</p><p class="act">${c.act}</p></div>`).join('');
  cards.forEach((c, i) => miniImpact(document.getElementById('mini' + i), c.parts));
}

/* ---------- wiring ---------- */
function render() {
  hideTip();
  renderCeo();
  const series = byMonth(visibleRows());
  renderKpis(series);
  renderTrends(series);
  renderMovers();
  renderHeat();
}
function init() {
  document.getElementById('srcnote').textContent = `${monthName(MONTHS[0])} to ${monthName(MONTHS[MONTHS.length - 1], true)}`;
  const sel = document.getElementById('month');
  sel.innerHTML = MONTHS.map(m => `<option value="${m}">${monthName(m, true)}</option>`).join('');
  sel.value = state.month;
  sel.onchange = () => { state.month = sel.value; render(); };
  document.getElementById('perday').onchange = e => { state.perDay = e.target.checked; render(); };
  document.getElementById('flagged').onchange = e => { state.flagged = e.target.checked; render(); };
  const root = document.documentElement;
  try { const t = localStorage.getItem('liftiq-theme'); if (t) root.dataset.theme = t; } catch (e) {}
  document.getElementById('theme').onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('liftiq-theme', root.dataset.theme); } catch (e) {}
    render();
  };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
  let w = 0, timer;
  new ResizeObserver(([e]) => {
    const nw = Math.round(e.contentRect.width); if (nw === w) return;
    const first = !w; w = nw; if (first) return;
    clearTimeout(timer); timer = setTimeout(render, 100);
  }).observe(document.querySelector('main'));
  document.addEventListener('pointerdown', e => { if (!e.target.closest('svg, .heat')) hideTip(); });
  renderNotes();
  render();
}
init();
</script>

</html>
